[workspace]
resolver = "2"
members = ["crates/voxel-core", "crates/voxel-view", "crates/voxel-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
