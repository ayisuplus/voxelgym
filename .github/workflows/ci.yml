name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust correctness (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release

  python:
    name: Python correctness (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Python and CPU ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e "python[dev]"
      - name: Build and install the native extension
        run: |
          maturin build --release -m crates/voxel-py/Cargo.toml --out target/wheels
          python -m pip install --force-reinstall --no-deps target/wheels/*.whl
      - run: python -m pytest python/tests -q

  rust-coverage:
    name: Rust coverage (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Install non-ML Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "python[dev]"
      - name: Prepare the shared LLVM instrumentation environment
        run: |
          mkdir -p coverage/rust
          cargo llvm-cov show-env --sh --branch > coverage/rust/llvm-cov-env.sh
          source coverage/rust/llvm-cov-env.sh
          cargo llvm-cov clean --workspace
      - name: Run Rust and external Python tests under one profile
        run: |
          source coverage/rust/llvm-cov-env.sh
          cargo test --workspace --release
          maturin build --release -m crates/voxel-py/Cargo.toml --out target/wheels
          python -m pip install --force-reinstall --no-deps target/wheels/*.whl
          python -m pytest python/tests -q -m "not ml"
      - name: Create Rust coverage reports
        run: |
          source coverage/rust/llvm-cov-env.sh
          cargo llvm-cov report --release --branch --html --output-dir coverage/rust
          cargo llvm-cov report --release --branch --json --output-path coverage/rust/coverage.json
          cargo llvm-cov report --release --branch --lcov --output-path coverage/rust/lcov.info
          cargo llvm-cov report --release --branch > coverage/rust/summary.txt
          cargo llvm-cov report --release --branch --package voxel-core > coverage/rust/voxel-core.txt
          cargo llvm-cov report --release --branch --package voxel-view > coverage/rust/voxel-view.txt
          cargo llvm-cov report --release --branch --package voxel-py > coverage/rust/voxel-py.txt
      - name: Validate all crates are represented
        run: |
          for crate in voxel-core voxel-view voxel-py; do
            jq -e --arg prefix "crates/$crate/src/" 'any(.data[].files[]; .filename | contains($prefix))' coverage/rust/coverage.json
          done
          jq -e --arg source "crates/voxel-py/src/lib.rs" 'any(.data[].files[]; ((.filename | endswith($source)) and (.summary.lines.covered > 0)))' coverage/rust/coverage.json
      - name: Enforce Rust line coverage
        run: |
          source coverage/rust/llvm-cov-env.sh
          cargo llvm-cov report --release --branch --fail-under-lines 80
      - name: Add Rust coverage to the job summary
        if: always()
        run: |
          if [ -f coverage/rust/summary.txt ]; then
            echo "## Rust workspace coverage" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat coverage/rust/summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            for crate in voxel-core voxel-view voxel-py; do
              if [ -f "coverage/rust/$crate.txt" ]; then
                echo "### $crate" >> "$GITHUB_STEP_SUMMARY"
                echo '```text' >> "$GITHUB_STEP_SUMMARY"
                cat "coverage/rust/$crate.txt" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          fi
      - name: Upload Rust coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          if-no-files-found: warn
          path: |
            coverage/rust/html
            coverage/rust/coverage.json
            coverage/rust/lcov.info
            coverage/rust/summary.txt
            coverage/rust/voxel-core.txt
            coverage/rust/voxel-view.txt
            coverage/rust/voxel-py.txt

  python-coverage:
    name: Python coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Python and CPU ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e "python[dev]"
      - name: Build and install the native extension
        run: |
          maturin build --release -m crates/voxel-py/Cargo.toml --out target/wheels
          python -m pip install --force-reinstall --no-deps target/wheels/*.whl
      - name: Run the full Python coverage suite
        run: |
          set -o pipefail
          mkdir -p coverage/python
          COVERAGE_FILE=coverage/python/.coverage python -m pytest python/tests -q \
            --cov=python/voxelgym --cov=web --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=html:coverage/python/html \
            --cov-report=xml:coverage/python/coverage.xml \
            --cov-report=json:coverage/python/coverage.json \
            --cov-fail-under=0 2>&1 | tee coverage/python/summary.txt
      - name: Enforce Python line coverage
        run: |
          jq -r '"Line coverage: \((.totals.covered_lines * 100 / .totals.num_statements) * 10 | round / 10)% (\(.totals.covered_lines)/\(.totals.num_statements))"' coverage/python/coverage.json | tee -a coverage/python/summary.txt
          jq -e '(.totals.covered_lines * 100 / .totals.num_statements) >= 80' coverage/python/coverage.json
      - name: Add Python coverage to the job summary
        if: always()
        run: |
          if [ -f coverage/python/summary.txt ]; then
            echo "## Python coverage" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat coverage/python/summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Python coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            coverage/python/html
            coverage/python/coverage.xml
            coverage/python/coverage.json
            coverage/python/.coverage
            coverage/python/summary.txt

  web-coverage:
    name: Browser JavaScript coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser test dependencies
        working-directory: web
        run: npm ci
      - name: Run Vitest with V8 coverage
        working-directory: web
        run: |
          set -o pipefail
          # Vitest clears its reports directory at startup, so keep the live
          # terminal capture beside it instead of racing that cleanup.
          npm run coverage 2>&1 | tee coverage-summary.txt
      - name: Add JavaScript coverage to the job summary
        if: always()
        run: |
          if [ -f web/coverage-summary.txt ]; then
            echo "## Browser JavaScript coverage" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat web/coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload JavaScript coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          if-no-files-found: warn
          path: |
            web/coverage
            web/coverage-summary.txt
