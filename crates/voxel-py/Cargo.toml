[package]
name = "voxel-py"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "voxelgym_rs"
crate-type = ["cdylib"]

[dependencies]
voxel-core = { path = "../voxel-core" }
voxel-view = { path = "../voxel-view" }
pyo3 = { version = "=0.24.2", features = ["extension-module", "abi3-py311"] }
numpy = "=0.24.0"
ndarray = "=0.16.1"
rayon = "=1.10.0"
