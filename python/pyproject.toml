[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxelgym"
version = "0.1.0"
description = "Deterministic voxel physics simulator with gymnasium API for training AI physical understanding"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["gymnasium", "numpy", "pyarrow"]

[project.optional-dependencies]
# everything the README quickstart lists beyond the runtime deps, plus the
# web demo; install with: pip install -e python[dev]
dev = [
    "coverage",
    "maturin",
    "pytest",
    "pytest-cov",
    "fastapi",
    "httpx",
    "uvicorn[standard]",
]
ml = [
    "torch",
]

[tool.pytest.ini_options]
markers = [
    "ml: tests that require the optional CPU PyTorch dependency",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["voxelgym*"]
