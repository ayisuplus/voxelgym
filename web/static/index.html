<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>voxelgym — live training view</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>voxelgym <span class="sub">live training view</span></h1>
  <div id="conn" class="pill warn">connecting…</div>
</header>

<main>
  <section class="hero">
    <figure class="herofig">
      <canvas id="chase" width="128" height="128"></canvas>
      <div id="banner" class="banner"></div>
      <figcaption>chase cam — the agent is the orange figure</figcaption>
    </figure>
    <figure>
      <canvas id="lidar" width="256" height="16"></canvas>
      <figcaption>lidar range image 16×256 (near = bright)</figcaption>
    </figure>
  </section>

  <aside>
    <div class="row2">
      <figure>
        <canvas id="view" width="128" height="128"></canvas>
        <figcaption>agent view</figcaption>
      </figure>
      <figure>
        <canvas id="seg" width="128" height="128"></canvas>
        <figcaption>segmentation</figcaption>
      </figure>
    </div>
    <div id="hud"></div>
    <canvas id="bars" width="288" height="64"></canvas>
    <div class="controls">
      <label>task <select id="task"></select></label>
      <div id="taskdesc" class="desc"></div>
      <label>seed <input id="seed" type="number" value="0"></label>
      <label>speed <input id="speed" type="range" min="1" max="100" value="2">
        <span id="speedv">2</span> tick/frame</label>
      <label>policy
        <select id="policy">
          <option value="expert">oracle expert</option>
          <option value="random">random</option>
        </select></label>
      <div class="btns">
        <button id="pause">⏸ pause</button>
        <button id="reset">↺ reset</button>
      </div>
    </div>
  </aside>
</main>

<script src="/static/app.js"></script>
</body>
</html>
